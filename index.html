<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>采购管理系统</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- 启动遮罩 -->
<div id="boot">
  <div class="spin"></div>
  <div style="color:#475569;font-size:14px" id="bootText">正在初始化 SQLite 数据库…</div>
</div>

<!-- 登录页 -->
<div id="loginPage" class="hidden">
  <div class="login-box">
    <h1>📦 采购管理系统</h1>
    <div class="sub">Office &amp; Daily Supplies Procurement · SQLite</div>
    <label>用户名</label>
    <input id="loginUser" placeholder="请输入用户名" onkeydown="if(event.key==='Enter')document.getElementById('loginPwd').focus()">
    <label>密码</label>
    <input id="loginPwd" type="password" placeholder="请输入密码" onkeydown="if(event.key==='Enter')doLogin()">
    <button class="btn-primary" onclick="doLogin()">登 录</button>
    <div class="login-tip">
      默认账号：<b>管理员</b> admin / 123456<br>
      &emsp;&emsp;&emsp;&nbsp;<b>普通用户</b> user / 123456
    </div>
  </div>
</div>

<!-- 主界面 -->
<div id="app" class="hidden">
  <header>
    <div class="logo"><span>采</span>采购管理系统</div>
    <div class="right">
      <span id="cartEntry" class="hidden"><button class="btn-gray" onclick="openCartModal()">🛒 采购车 (<b id="cartCount">0</b>)</button></span>
      <span class="role-tag" id="roleTag"></span>
      <span id="whoami" style="font-weight:600"></span>
      <button class="btn-gray btn-sm" onclick="logout()">退出登录</button>
    </div>
  </header>
  <div id="layout">
    <aside id="sidebar"></aside>
    <main id="main"></main>
  </div>
</div>

<div id="modalOverlay" class="hidden" onclick="if(event.target===this)closeModal()"></div>
<div id="toast" class="hidden"></div>

<!-- SQLite 引擎（提供全局 initSqlJs） -->
<script src="js/vendor/sql-wasm.js"></script>
<!-- 通用工具 -->
<script src="js/utils.js"></script>
<!-- 数据库层（SQLite 引擎 + schema/查询/持久化） -->
<script src="js/db.js"></script>
<!-- 通用 UI 组件（弹窗 / Toast） -->
<script src="js/ui.js"></script>
<!-- 各页面模块 -->
<script src="js/pages/shop.js"></script>
<script src="js/pages/my-requests.js"></script>
<script src="js/pages/dashboard.js"></script>
<script src="js/pages/items.js"></script>
<script src="js/pages/review.js"></script>
<script src="js/pages/export.js"></script>
<script src="js/pages/users.js"></script>
<!-- 应用入口（会话 / 路由 / 启动） -->
<script src="js/app.js"></script>
</body>
</html>
